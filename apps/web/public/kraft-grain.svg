<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <!--
    Seamless kraft/walnut paper fibre texture. Isotropic (equal x/y)
    baseFrequency + stitchTiles="stitch" avoids the old anisotropic
    (0.012 x 0.9) turbulence, which stretched into visible directional
    bands ("wood grain") once tiled. luminanceToAlpha + a low-slope linear
    feFuncA keep the result a low-contrast alpha mask (fine fibre flecks),
    not a high-contrast pattern — the base colour and vignette are supplied
    by the caller (KraftTable.web.tsx / site.css), never baked in here, so
    this file is reused unmodified for both the kraft (light) and walnut
    (dark) table.
  -->
  <filter id="fibre">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="7" stitchTiles="stitch" result="noise" />
    <feColorMatrix in="noise" type="luminanceToAlpha" result="alpha" />
    <feComponentTransfer in="alpha">
      <feFuncA type="linear" slope="0.16" intercept="0" />
    </feComponentTransfer>
  </filter>
  <rect width="480" height="480" filter="url(#fibre)" />
</svg>
