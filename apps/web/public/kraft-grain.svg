<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <filter id="fibre">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.9" numOctaves="2" seed="7" stitchTiles="stitch" result="noise" />
