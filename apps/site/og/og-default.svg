<?xml version="1.0" encoding="UTF-8"?>
<!--
  Keepsake default Open Graph image, source of truth.

  Rendered to ../public/og-default.png at 1200x630 with resvg-js-cli
  (fonts passed via font file flags, see apps/site/README.md), falling back
  to qlmanage or Chrome headless against an HTML wrapper if unavailable.

  Colors are the packages/tokens/src/colors.ts light-mode values: bg #FBF7F0,
  ink #1F1B17, accent #B9502F, onAccent #FFF8F2, textSecondary #5C544B.
-->
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @font-face {
        font-family: "Fraunces";
        src: url("file:///tmp/keepsake-fonts/Fraunces-Italic-VF.ttf");
        font-weight: 100 900;
        font-style: italic;
      }
      @font-face {
        font-family: "Fraunces";
        src: url("file:///tmp/keepsake-fonts/Fraunces-VF.ttf");
        font-weight: 100 900;
        font-style: normal;
      }
      @font-face {
        font-family: "Inter";
        src: url("file:///tmp/keepsake-fonts/inter/InterVariable.ttf");
        font-weight: 100 900;
        font-style: normal;
      }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#FBF7F0" />

  <!-- subtle paper texture rects for depth (kept simple: two soft washes) -->
  <rect x="0" y="0" width="1200" height="630" fill="#F3EDE2" opacity="0.35" />
  <rect x="-100" y="380" width="1000" height="500" fill="#F2D9CC" opacity="0.25" transform="rotate(-8 400 500)" />

  <!-- terracotta seal mark -->
  <circle cx="120" cy="120" r="34" fill="none" stroke="#B9502F" stroke-width="3" />
  <circle cx="120" cy="120" r="22" fill="none" stroke="#B9502F" stroke-width="1.5" />
  <circle cx="120" cy="120" r="4" fill="#B9502F" />

  <!-- wordmark -->
  <text
    x="120"
    y="270"
    font-family="Fraunces"
    font-style="italic"
    font-weight="600" font-variation-settings="'wght' 600"
    font-size="92"
    fill="#1F1B17"
  >Keepsake</text>

  <!-- headline -->
  <text
    x="122"
    y="360"
    font-family="Inter"
    font-weight="500" font-variation-settings="'wght' 500"
    font-size="34"
    fill="#5C544B"
  >Give a keepsake a second life.</text>

  <!-- footer line -->
  <text
    x="122"
    y="560"
    font-family="Inter"
    font-weight="600" font-variation-settings="'wght' 600"
    font-size="22"
    letter-spacing="0.6"
    fill="#96401F"
  >KEEPSAKE.ING</text>
</svg>
