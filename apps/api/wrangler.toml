# `[vars]` comment.
CF_ZONE_ID = "dcc1fb09eeeba27a343fc1d98aff9094"
MOCK_AI = "0"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "keepsake-db-preview"
database_id = "2cfbc1c8-39b9-4653-814e-9fa737d1689f"
migrations_dir = "migrations"

[[env.preview.r2_buckets]]
