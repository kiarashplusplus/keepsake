CF_ZONE_ID = "dcc1fb09eeeba27a343fc1d98aff9094"
CF_ACCOUNT_ID = "dc6a87ed4a4269ed74c8f508b275b703"
CF_SCRIPT_NAME = "keepsake-production"
MOCK_AI = "0"
# "1" — approved for production 2026-09-08 (Kiarash's call). See the
# top-level [vars] comment for the admission mechanics (grant + D1-guarded
# counters, not Turnstile) and `[env.preview]` above for the pilot this
