name = "keepsake"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# The Worker serves the static Expo export directly (no separate Pages
# project) so there is one deploy, one `/health`, and one place version skew
# is guarded. `run_worker_first` is the list of paths that must never be
# answered by a cached static asset even when one happens to exist at that
# path (an old `/health` snapshot, a stale `/version.json`) — everything else
# falls through to the SPA shell on a 404, which is what makes client-side
# routing on `/item/:id` work on a hard refresh.
# Issue #84 (launch audit finding 2, round two): a `run_worker_first` list of
# literal paths only protects the paths someone remembered to add. `/`,
# `/about`, `/give`, `/mine` and every other pre-rendered SPA page matched a
# real static asset and so were answered by Cloudflare's assets system
# *without ever invoking this Worker* — which meant the non-production
# `X-Robots-Tag: noindex` middleware in `src/index.ts` never ran for the one
# page (the feed root) a searcher would actually land on, even though
# `/robots.txt`/`/sitemap.xml`/`/item/*` were correctly covered. `true` routes
# every request through the Worker first; the catch-all at the bottom of
# `src/index.ts` still hands anything it doesn't own straight to `ASSETS`, so
# behavior for an actual asset fetch is unchanged — only production (below)
# keeps the narrower list, since production doesn't need this and an extra
# Worker hop on every hashed asset request is a real cost on the live site.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[ai]
binding = "AI"

# Issue #38: semantic search over story + aspects.
#
# These bindings were commented out while nobody could confirm the indexes
# existed — an uncommented `[[vectorize]]` naming a missing index does not
# degrade gracefully, it fails the Worker upload and takes down *every*
# deploy of this Worker. That risk is now retired: the three indexes were
# confirmed present on 2026-09-07 via the Vectorize API, all
# `dimensions = 768, metric = cosine`:
#
#   keepsake-listings-dev         created 2026-09-07T05:12:58Z
#   keepsake-listings-preview     created 2026-09-07T05:13:07Z
#   keepsake-listings-production  created 2026-09-07T05:13:10Z
#
# 768 matches `MODELS.embedding`; cosine matches how `search/search.ts` reads
# scores. Neither can be altered after creation — only deleted and recreated.
# One index per environment, the same separation the D1/R2/KV bindings below
# already follow, so dev/preview/production never share one.
#
# The binding being present is NOT the same as the feature being on: that is
# `SEMANTIC_SEARCH` in each [vars] block, checked before any embedding or
# Vectorize call happens. `src/search/vectorize.ts` still treats an absent
# `env.VECTORIZE` as "fall back to FTS", which is why `src/env.ts` keeps it
# declared optional.
#
# Like `[ai]` above, Vectorize has no local emulator (`V4RemoteBinding` in
# miniflare's own types) — every test stubs `env.VECTORIZE` directly, the
# same convention `test/moderation.test.ts` uses for `env.AI`.

[[vectorize]]
binding = "VECTORIZE"
index_name = "keepsake-listings-dev"

# Issue #14: `SENTRY_DSN` was never set (it needs a Sentry account only
# Kiarash can create), so every `Sentry.captureException`/`captureMessage`
# call in the Worker was a silent no-op. Workers Logs is a Cloudflare-native
# replacement: no third-party account, no secret to provision, and it's on
# the Free plan (200,000 logs/day, 3-day retention) — see
# docs/design/ops.md#observability for what's kept (redaction) and what's
# lost (retention, alerting, issue grouping) versus Sentry. `enabled = true`
# turns the feature on for this Worker; `head_sampling_rate = 1` keeps every
# log line rather than sampling, since this Worker's volume is nowhere near
# the daily cap. Restated under `[env.preview]`/`[env.production]` below —
# Wrangler does not inherit this block into a named environment either, same
# as every other binding/var in this file.
[observability]
enabled = true
head_sampling_rate = 1

[[send_email]]
name = "EMAIL"

# `moderationRetry` picks up listings whose moderation call errored or never
# landed (Worker eviction mid-`waitUntil`, AI timeout) so a transient failure
# doesn't strand a listing in `pending` forever. `orphanSweep` runs once a day,
# off-peak, to delete photos uploaded but never attached to a listing —
# abandoned `give` flows and abuse probes both leave these behind.
#
# **Not restated under `[env.preview]`/`[env.production]`, and that is
# deliberate — verified, not assumed.** Every other block in this file is
# repeated per environment because Wrangler genuinely does not inherit
# `[vars]` or any `[[binding]]`; `[triggers]` sitting only at the top level
# therefore looks exactly like the bug that would leave both crons unattached
# in production. It is not. Checked two ways against the pinned wrangler
# 4.129.0, 2026-09-07:
#
#   1. Wrangler's config normalizer registers `triggers` through its
#      `inheritable(...)` helper — the same one `main`, `compatibility_date`
#      and `routes` use — and it sits *above* that function's literal
#      `// Not inherited fields` comment, under which `vars`, `secrets` and
#      every binding are registered via `notInheritable(...)`
#      (`node_modules/wrangler/wrangler-dist/cli.js`).
#   2. Resolved this actual file through wrangler's own public API rather
#      than by reading its source:
#        node -e 'const {unstable_readConfig}=require("wrangler");
#          for (const env of [undefined,"preview","production"])
#            console.log(env, unstable_readConfig({config:"wrangler.toml",env}).triggers)'
#      prints `{"crons":["*/5 * * * *","17 3 * * *"]}` for all three.
#
# Note `wrangler deploy --env production --dry-run` is *not* evidence here:
# it prints bindings and vars but says nothing about triggers, in either the
# top-level or the named-environment form. It was the first thing tried.
#
# Restating the list under each env block would work too, but it would mean
# three places to keep in step for no gain. What keeps this honest instead is
# preflight's `cron-triggers` check (`tools/preflight/preflight.mjs`): it
# asserts every deployed tier still resolves a non-empty, syntactically valid
# cron list — including the one override that would silently switch a tier's
# crons off, `[env.<name>.triggers] crons = []` — and that every schedule
# below matches a `case` in `scheduled()` (`src/index.ts`), which dispatches
# on the literal string. Editing a schedule here without editing that switch
# leaves the job registered with Cloudflare, firing on time, and falling
# through to `default:`: a `console.warn` and no work, on an invocation the
# platform records as successful.
[triggers]
crons = ["*/5 * * * *", "17 3 * * *"]

[vars]
# Local/dev defaults. Every one of these is repeated verbatim under
# `[env.preview]` and `[env.production]` below: Wrangler does not inherit
# `[vars]` (or any binding) into a named environment, only the unscoped keys
# like `main` and `compatibility_date`. Restating them here is the only way
# an environment doesn't silently fall back to nothing.
ENVIRONMENT = "development"
# Overridden per deploy with `wrangler deploy --var COMMIT_SHA:<sha>`; the
# checked-in default is what you see running `wrangler dev` locally, where
# there is no commit to stamp.
COMMIT_SHA = "dev"

# --- Moderation budgets (KV counters in src/moderation/budget.ts) ---
# These are runaway protection, not a product tier: Workers AI meters its own
# allocation regardless of what is set here, and the app has no signed-up
# users to ration against. The ceilings exist so a scraper or a retry loop
# can't spend the whole day's AI allocation before a real giver gets to post.
#
# Issue #18 (launch audit finding 8): MOD_IMAGE_DAILY_BUDGET is now charged
# once per photo (`cost: photos.length` in moderation/pipeline.ts), not once
# per listing — the pipeline makes up to 5 vision calls per listing, so a
# number read as "listings/day" was actually 5x that in real vision calls.
# `[env.preview]`/`[env.production]` below raise both ceilings for real
# (estimated) launch traffic instead of leaving every environment at the
# same numbers sized against zero traffic; this dev/local block is
# deliberately left low since it's never customer-facing.
MOD_TEXT_DAILY_BUDGET = "1000"
MOD_IMAGE_DAILY_BUDGET = "3000"
# AI autofill (POST /api/photos/:id/suggest). Its own counter, deliberately
# not shared with MOD_IMAGE_DAILY_BUDGET: an exhausted image budget leaves
# listings pending until midnight UTC, so a burst of autofill calls must
# never be able to starve the budget a real listing needs to finish
# moderating. ~15 neurons/call, ~$0.17 per 1000 listings — this is runaway
# protection, not a real usage ceiling.
SUGGEST_DAILY_BUDGET = "1000"
# Re-embedding on listing create/edit (issue #38, `src/search/reembed.ts`).
# Global-only, no per-IP twin: unlike SUGGEST_DAILY_BUDGET this isn't behind
# its own client-callable endpoint, and a failure here degrades to the FTS
# fallback rather than parking anything, so a single runaway-protection
# ceiling is enough. Pure runaway protection like every other budget in this
# block, not sized against real traffic yet. Only ever consulted when
# SEMANTIC_SEARCH is on, which since 2026-09-07 it is in every environment.
EMBED_DAILY_BUDGET = "2000"
# Issue #38's kill switch, now ON in every environment — the runbook errand
# was completed 2026-09-07: the three indexes are confirmed to exist
# (768/cosine), the embedding model was exercised against real Workers AI,
# the full embed → upsert → query round trip was run against the real dev
# index, and MIN_SCORE was re-derived from measurements
# (`docs/design/min-score-calibration.md`).
#
# It remains a kill switch, and reverting it to "0" is still the first thing
# to try if search misbehaves: with it off, `GET /api/feed?q=` is exactly
# `main`'s FTS5 search, no embedding call and no Vectorize call happen on
# either the read or the write path, and no AI budget is spent.
# `src/env.ts`'s `semanticSearchEnabled` treats anything other than the
# literal "1" as off, so it cannot be enabled by accident.
#
# Turning it on was timed deliberately, but the timing claim it shipped with
# was already out of date. `reembedListing` runs on listing create, listing
# edit, and the #37 aspects backfill — there is no standalone vector backfill
# — so any listing created while this is "0" has no vector and is invisible
# to vector search until it is next written. The flip was justified by the
# production catalogue being empty; it was not. #135 measured a real
# production listing (the KastKing spool) hours before this merged, and this
# has never been deployed anywhere, so *every* listing that exists today
# predates the feature. Running the aspects backfill after deploy embeds
# them, which is why reembedListing is wired into it. If this is ever
# switched off again while listings are being created, switching it back on
# means running that backfill again — or writing a vector-only one.
SEMANTIC_SEARCH = "1"
# Per-IP daily ceilings for the write endpoints — all six of them: listing
# create, request, photo upload, report, outbound email, and AI autofill,
# each named below. An address is not a person — a household or a mobile
# carrier's CGNAT range sits behind one IP — so these are set loose on
# purpose; they catch a runaway script, not a family posting a few keepsakes
# in a day.
#
# Issue #128: this comment used to introduce three of them as though that
# were the set, which is how an audit came to report the report and email
# ceilings as undeclared when they had been added an hour earlier. A comment
# claiming completeness is not a guarantee of it, so the guarantee now lives
# somewhere that can fail: preflight's `var-usage` check reads what
# `apps/api/src` actually reads and requires it to be declared here (and
# every name here to be read by something, and every code fallback to equal
# the value declared here). Add a per-IP ceiling to the code without adding
# it below and CI says so.
LISTING_IP_DAILY_BUDGET = "20"
REQUEST_IP_DAILY_BUDGET = "20"
UPLOAD_IP_DAILY_BUDGET = "60"
# Issue #92: hard per-IP daily ceilings behind the two burst-only write paths
# that had none. Reports drive the three-report auto-hide, and the handler's
# per-listing `ip_digest` check only stops repeat reports of the *same*
# listing — nothing stopped one address reporting many different ones.
# EMAIL is one shared ceiling for POST /api/recover and POST /api/me/email,
# since what's rationed is outbound mail, not the path asked for. Both are
# generous for a person and instant for a script; the same numbers in every
# environment, since neither scales with traffic the way an AI budget does.
REPORT_IP_DAILY_BUDGET = "10"
EMAIL_IP_DAILY_BUDGET = "10"
# Loose for the same reason as the ceilings above — one giver calls this a
# handful of times per give flow; this only stops a single retry loop from
# working through SUGGEST_DAILY_BUDGET alone.
SUGGEST_IP_DAILY_BUDGET = "30"
# Three independent reporters is enough signal to pull a listing from public
# view pending Kiarash's review; it is not a ban, just a hide.
REPORT_AUTOHIDE_THRESHOLD = "3"
# Issue #39: the minimum number of approved listings an aspect value needs
# before `GET /api/feed/shelves` renders it as a shelf — see
# `shelfMinItems()` in `src/env.ts` for why `3` and why it's the same in
# every environment below, unlike the traffic-scaled budgets above.
SHELF_MIN_ITEMS = "3"
# 5 MiB matches the client-side resize ceiling in apps/web; this is the
# server-side backstop in case a client is old, broken, or hostile. Read by
# `src/routes/photos.ts` via `parseIntVar` — unlike the two vars removed
# below, this one does something.
MAX_PHOTO_BYTES = "5242880"
# Removed 2026-09-06 (launch audit): `MAX_PHOTOS` and `IMAGE_TRANSFORMS_ENABLED`
# were declared in all three environment blocks and referenced nowhere in
# `apps/api/src`. The real photo limit is a hardcoded `.max(5)` in
# `CreateListingInput` (packages/contracts), shared with the client, so turning
# `MAX_PHOTOS` down in production would have done exactly nothing while reading
# like a control someone could pull in an incident. `IMAGE_TRANSFORMS_ENABLED`
# had no code path at all. Configuration that cannot change behavior is worse
# than no configuration: add them back the same commit that reads them.
# `cf` uses the `[[send_email]]` binding; `resend` is the fallback behind the
# same `sendMail()` interface if Email Service enablement or domain
# onboarding (see plan Risks #1) doesn't land in time.
#
# Issue #127: `resend` is NOT a hot switch. Do not reach for it mid-incident
# without doing DNS work first. `_dmarc.keepsake.ing` is `p=reject`, and the
# only SPF/DKIM records in this zone belong to Cloudflare's
# `cf-bounce.keepsake.ing` — which relaxed-aligns with the
# `hello@keepsake.ing` in `EMAIL_FROM` below, and is the whole reason mail
# passes DMARC today. Resend's bounce domain is not under keepsake.ing and
# the zone carries none of its records, so flipping this var on its own
# produces mail that fails DMARC against a *reject* policy: receivers
# discard it outright rather than spam-foldering it, `sendMail()` still
# returns success, and the policy has no `rua=` for anyone to find out from.
# The failover meant to rescue a partial email outage would quietly convert
# it into a total one. Add Resend's SPF/DKIM to the zone, verify alignment,
# *then* flip this. Same rule as the `MAX_PHOTOS` note above: a control that
# cannot do what it appears to do is worse than no control.
EMAIL_PROVIDER = "cf"
EMAIL_FROM = "Keepsake <hello@keepsake.ing>"
# Local and e2e never send. The bindings exist so the code path is exercised;
# "off" makes a real delivery impossible no matter what a test does.
EMAIL_MODE = "off"
EMAIL_ALLOWLIST = ""
SITE_URL = "http://localhost:8787"
# Issue #94: the keepsake.ing zone that `src/lib/photoCache.ts` purges a
# deleted photo's two variant URLs from, so the purge reaches every colo
# instead of only the one that executed the delete request
# (`caches.default` is per-colo). A zone id is a public identifier, not a
# credential — it's written down in `docs/runbooks/kiarash-checklist.md` —
# so it lives here as a var; the API token it pairs with
# (`CF_CACHE_PURGE_TOKEN`, `Zone.Cache Purge`) is a Worker secret, set with
# `wrangler secret put`. Empty here because local dev serves photos from
# `http://localhost:8787`, which is not in any zone and has nothing to
# purge; with either half missing the zone call is skipped silently and the
# per-colo delete is still done. That's a bounded state, not a hole:
# `images.ts` serves `max-age=3600`, so an unreached copy expires within the
# hour regardless.
CF_ZONE_ID = ""
# M1: flips the moderation pipeline to canned responses for local dev and
# Playwright, so `give` works without live Workers AI calls.
MOCK_AI = "0"

# --- D1 ---
# Local placeholder id: `wrangler dev` (no --remote) creates a local SQLite
# file keyed by binding name and ignores this value, so it never needs to be
# a real UUID until `[env.preview]` / `[env.production]` point at real
# databases created with `wrangler d1 create`.
[[d1_databases]]
binding = "DB"
database_name = "keepsake-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# --- R2 ---
# No versioning, no lifecycle rule on this binding — checked directly against
# this account (issue #17, docs/runbooks/restore.md#r2-photo-backup): R2 has
# no native versioning to enable at all, and `orphanSweep`
# (src/cron/orphanSweep.ts) still deletes unconditionally. The mitigation
# lives outside this binding on purpose, so it survives a bug in the code
# that reads this binding: `tools/backup-photos.mjs` copies every referenced
# photo into a same-account `<bucket_name>-backup` bucket that nothing here
# ever deletes from. That bucket is not declared as a binding because no
# Worker code reads it — an unread binding is exactly the
# configuration-that-can't-change-behavior anti-pattern the MAX_PHOTOS /
# IMAGE_TRANSFORMS_ENABLED removal note above (in [vars]) warns about.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "keepsake-photos-dev"

# --- KV ---
# `id = "local"` is a placeholder the same way the D1 id above is: local
# `wrangler dev` never reads it, it only needs to be a non-empty string.
[[kv_namespaces]]
binding = "KV"
id = "local"

# --- Rate limits (Cloudflare Rate Limiting API bindings) ---
# These are short-window burst brakes in front of the edge, complementary to
# the calendar-day KV budgets above: a `[[ratelimits]]` binding only accepts
# a 10s or 60s period, so it cannot express "20 listings/day" directly — that
# ceiling lives in src/moderation/budget.ts's per-IP daily counters instead.
# What the binding buys is protection against a burst within a single minute
# (a retry loop, a misbehaving client) before that request ever reaches the
# KV read/increment. Limits below are the daily figure divided down to a
# per-minute allowance with headroom for a human clicking quickly, not a
# literal transcription of the plan's hourly numbers — Wrangler rejects any
# `period` other than 10 or 60 (see apps/api's typecheck report for the
# rejected `600`/`3600` attempt this replaced).
#
# Issue #8 (launch audit finding 10): the `limit` below is *not* a hard cap.
# Cloudflare's own docs for this binding say it plainly: "The Rate Limiting
# API is permissive, eventually consistent, and intentionally designed to
# not be used as an accurate accounting system" — counters are cached
# per-colo and reconciled asynchronously, so a burst that lands across
# several colos (or several requests within one colo's reconciliation
# window) rides through before the first refusal. Measured directly against
# `RL_UPLOAD = 10/60s`: 26 consecutive requests from one address got through
# before the first 429. That is Cloudflare's documented, intentional
# behavior, not a bug in how this binding is called (see
# `src/middleware/rateLimit.ts`'s `burst()` for the call site and why it
# isn't the backstop). Sizing the numbers down to compensate (e.g. "10"
# configured as "4") would chase a multiplier that isn't guaranteed to hold
# — the docs don't promise 2.6x, they promise "eventually" — so the fix here
# is honesty, not arithmetic: these are best-effort burst brakes, and the KV
# calendar-day budgets above (`checkAndBump`, `middleware/rateLimit.ts`'s
# `dailyBudget()`) are the only ceiling here that's actually a hard cap.
# Nothing security-critical is allowed to depend on one of these numbers
# being exact.
[[ratelimits]]
name = "RL_READ"
namespace_id = "1001"
simple = { limit = 300, period = 60 }

[[ratelimits]]
name = "RL_WRITE"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RL_UPLOAD"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_CREATE"
namespace_id = "1004"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "RL_REQUEST"
namespace_id = "1005"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "RL_REPORT"
namespace_id = "1006"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "RL_EMAIL"
namespace_id = "1007"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "RL_ADMIN"
namespace_id = "1008"
simple = { limit = 120, period = 60 }

# ============================================================================
# [env.preview] — one shared Worker per plan, its own D1/R2/KV/rate-limit
# namespaces so preview traffic (and its abuse) never touches production data.
# Every binding and every var is restated: Wrangler does not merge an env
# block with the top-level config for `[vars]` or any `[[...]]` binding.
# ============================================================================
[env.preview]
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Issue #84: `true`, not a literal-path list — see the top-level `[assets]`
# comment. Preview is the environment the noindex header exists to protect,
# so it gets the same blanket coverage as dev rather than the narrower,
# performance-motivated list production uses below.
[env.preview.assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[env.preview.ai]
binding = "AI"

# Index confirmed to exist 2026-09-07 (768/cosine) — see the top-level
# [[vectorize]] block. Whether search actually uses it is `SEMANTIC_SEARCH`
# in [env.preview.vars], not the presence of this binding.
[[env.preview.vectorize]]
binding = "VECTORIZE"
index_name = "keepsake-listings-preview"

[env.preview.observability]
enabled = true
head_sampling_rate = 1

[[env.preview.send_email]]
name = "EMAIL"

[env.preview.vars]
ENVIRONMENT = "preview"
COMMIT_SHA = "dev"
# Estimated for real preview-scale traffic (issue #18) — see the top-level
