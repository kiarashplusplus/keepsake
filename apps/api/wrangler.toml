name = "keepsake"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# The Worker serves the static Expo export directly (no separate Pages
# project) so there is one deploy, one `/health`, and one place version skew
# is guarded. `run_worker_first` is the list of paths that must never be
# answered by a cached static asset even when one happens to exist at that
# path (an old `/health` snapshot, a stale `/version.json`) — everything else
# falls through to the SPA shell on a 404, which is what makes client-side
# routing on `/item/:id` work on a hard refresh.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/i/*", "/item/*", "/health", "/version.json", "/sitemap.xml", "/robots.txt"]

[ai]
binding = "AI"

# Issue #14: `SENTRY_DSN` was never set (it needs a Sentry account only
# Kiarash can create), so every `Sentry.captureException`/`captureMessage`
# call in the Worker was a silent no-op. Workers Logs is a Cloudflare-native
# replacement: no third-party account, no secret to provision, and it's on
# the Free plan (200,000 logs/day, 3-day retention) — see
# docs/design/ops.md#observability for what's kept (redaction) and what's
# lost (retention, alerting, issue grouping) versus Sentry. `enabled = true`
# turns the feature on for this Worker; `head_sampling_rate = 1` keeps every
# log line rather than sampling, since this Worker's volume is nowhere near
# the daily cap. Restated under `[env.preview]`/`[env.production]` below —
# Wrangler does not inherit this block into a named environment either, same
# as every other binding/var in this file.
[observability]
enabled = true
head_sampling_rate = 1

[[send_email]]
name = "EMAIL"

# `moderationRetry` picks up listings whose moderation call errored or never
# landed (Worker eviction mid-`waitUntil`, AI timeout) so a transient failure
# doesn't strand a listing in `pending` forever. `orphanSweep` runs once a day,
# off-peak, to delete photos uploaded but never attached to a listing —
# abandoned `give` flows and abuse probes both leave these behind.
[triggers]
crons = ["*/5 * * * *", "17 3 * * *"]

[vars]
# Local/dev defaults. Every one of these is repeated verbatim under
# `[env.preview]` and `[env.production]` below: Wrangler does not inherit
# `[vars]` (or any binding) into a named environment, only the unscoped keys
# like `main` and `compatibility_date`. Restating them here is the only way
# an environment doesn't silently fall back to nothing.
ENVIRONMENT = "development"
# Overridden per deploy with `wrangler deploy --var COMMIT_SHA:<sha>`; the
# checked-in default is what you see running `wrangler dev` locally, where
# there is no commit to stamp.
COMMIT_SHA = "dev"

# --- Moderation budgets (KV counters in src/moderation/budget.ts) ---
# These are runaway protection, not a product tier: Workers AI meters its own
# allocation regardless of what is set here, and the app has no signed-up
# users to ration against. The ceilings exist so a scraper or a retry loop
# can't spend the whole day's AI allocation before a real giver gets to post.
#
# Issue #18 (launch audit finding 8): MOD_IMAGE_DAILY_BUDGET is now charged
# once per photo (`cost: photos.length` in moderation/pipeline.ts), not once
# per listing — the pipeline makes up to 5 vision calls per listing, so a
# number read as "listings/day" was actually 5x that in real vision calls.
# `[env.preview]`/`[env.production]` below raise both ceilings for real
# (estimated) launch traffic instead of leaving every environment at the
# same numbers sized against zero traffic; this dev/local block is
# deliberately left low since it's never customer-facing.
MOD_TEXT_DAILY_BUDGET = "1000"
MOD_IMAGE_DAILY_BUDGET = "3000"
# AI autofill (POST /api/photos/:id/suggest). Its own counter, deliberately
# not shared with MOD_IMAGE_DAILY_BUDGET: an exhausted image budget leaves
# listings pending until midnight UTC, so a burst of autofill calls must
# never be able to starve the budget a real listing needs to finish
# moderating. ~15 neurons/call, ~$0.17 per 1000 listings — this is runaway
# protection, not a real usage ceiling.
SUGGEST_DAILY_BUDGET = "1000"
# Per-IP daily ceilings for the write endpoints. An address is not a person —
# a household or a mobile carrier's CGNAT range sits behind one IP — so these
# are set loose on purpose; they catch a runaway script, not a family posting
# a few keepsakes in a day.
LISTING_IP_DAILY_BUDGET = "20"
REQUEST_IP_DAILY_BUDGET = "20"
UPLOAD_IP_DAILY_BUDGET = "60"
# Loose for the same reason as the ceilings above — one giver calls this a
# handful of times per give flow; this only stops a single retry loop from
# working through SUGGEST_DAILY_BUDGET alone.
SUGGEST_IP_DAILY_BUDGET = "30"
# Three independent reporters is enough signal to pull a listing from public
# view pending Kiarash's review; it is not a ban, just a hide.
REPORT_AUTOHIDE_THRESHOLD = "3"
# Issue #39: the minimum number of approved listings an aspect value needs
# before `GET /api/feed/shelves` renders it as a shelf — see
# `shelfMinItems()` in `src/env.ts` for why `3` and why it's the same in
# every environment below, unlike the traffic-scaled budgets above.
SHELF_MIN_ITEMS = "3"
# 5 MiB matches the client-side resize ceiling in apps/web; this is the
# server-side backstop in case a client is old, broken, or hostile. Read by
# `src/routes/photos.ts` via `parseIntVar` — unlike the two vars removed
# below, this one does something.
MAX_PHOTO_BYTES = "5242880"
# Removed 2026-09-06 (launch audit): `MAX_PHOTOS` and `IMAGE_TRANSFORMS_ENABLED`
# were declared in all three environment blocks and referenced nowhere in
# `apps/api/src`. The real photo limit is a hardcoded `.max(5)` in
# `CreateListingInput` (packages/contracts), shared with the client, so turning
# `MAX_PHOTOS` down in production would have done exactly nothing while reading
# like a control someone could pull in an incident. `IMAGE_TRANSFORMS_ENABLED`
# had no code path at all. Configuration that cannot change behavior is worse
# than no configuration: add them back the same commit that reads them.
# `cf` uses the `[[send_email]]` binding; `resend` is the fallback behind the
# same `sendMail()` interface if Email Service enablement or domain
# onboarding (see plan Risks #1) doesn't land in time.
EMAIL_PROVIDER = "cf"
EMAIL_FROM = "Keepsake <hello@keepsake.ing>"
# Local and e2e never send. The bindings exist so the code path is exercised;
# "off" makes a real delivery impossible no matter what a test does.
EMAIL_MODE = "off"
EMAIL_ALLOWLIST = ""
SITE_URL = "http://localhost:8787"
# M1: flips the moderation pipeline to canned responses for local dev and
# Playwright, so `give` works without live Workers AI calls.
MOCK_AI = "0"

# --- D1 ---
# Local placeholder id: `wrangler dev` (no --remote) creates a local SQLite
# file keyed by binding name and ignores this value, so it never needs to be
# a real UUID until `[env.preview]` / `[env.production]` point at real
# databases created with `wrangler d1 create`.
[[d1_databases]]
binding = "DB"
database_name = "keepsake-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# --- R2 ---
# No versioning, no lifecycle rule on this binding — checked directly against
# this account (issue #17, docs/runbooks/restore.md#r2-photo-backup): R2 has
# no native versioning to enable at all, and `orphanSweep`
# (src/cron/orphanSweep.ts) still deletes unconditionally. The mitigation
# lives outside this binding on purpose, so it survives a bug in the code
# that reads this binding: `tools/backup-photos.mjs` copies every referenced
# photo into a same-account `<bucket_name>-backup` bucket that nothing here
# ever deletes from. That bucket is not declared as a binding because no
# Worker code reads it — an unread binding is exactly the
# configuration-that-can't-change-behavior anti-pattern the MAX_PHOTOS /
# IMAGE_TRANSFORMS_ENABLED removal note above (in [vars]) warns about.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "keepsake-photos-dev"

# --- KV ---
# `id = "local"` is a placeholder the same way the D1 id above is: local
# `wrangler dev` never reads it, it only needs to be a non-empty string.
[[kv_namespaces]]
binding = "KV"
id = "local"

# --- Rate limits (Cloudflare Rate Limiting API bindings) ---
# These are short-window burst brakes in front of the edge, complementary to
# the calendar-day KV budgets above: a `[[ratelimits]]` binding only accepts
# a 10s or 60s period, so it cannot express "20 listings/day" directly — that
# ceiling lives in src/moderation/budget.ts's per-IP daily counters instead.
# What the binding buys is protection against a burst within a single minute
# (a retry loop, a misbehaving client) before that request ever reaches the
# KV read/increment. Limits below are the daily figure divided down to a
# per-minute allowance with headroom for a human clicking quickly, not a
# literal transcription of the plan's hourly numbers — Wrangler rejects any
# `period` other than 10 or 60 (see apps/api's typecheck report for the
# rejected `600`/`3600` attempt this replaced).
#
# Issue #8 (launch audit finding 10): the `limit` below is *not* a hard cap.
# Cloudflare's own docs for this binding say it plainly: "The Rate Limiting
# API is permissive, eventually consistent, and intentionally designed to
# not be used as an accurate accounting system" — counters are cached
# per-colo and reconciled asynchronously, so a burst that lands across
# several colos (or several requests within one colo's reconciliation
# window) rides through before the first refusal. Measured directly against
# `RL_UPLOAD = 10/60s`: 26 consecutive requests from one address got through
# before the first 429. That is Cloudflare's documented, intentional
# behavior, not a bug in how this binding is called (see
# `src/middleware/rateLimit.ts`'s `burst()` for the call site and why it
# isn't the backstop). Sizing the numbers down to compensate (e.g. "10"
# configured as "4") would chase a multiplier that isn't guaranteed to hold
# — the docs don't promise 2.6x, they promise "eventually" — so the fix here
# is honesty, not arithmetic: these are best-effort burst brakes, and the KV
# calendar-day budgets above (`checkAndBump`, `middleware/rateLimit.ts`'s
# `dailyBudget()`) are the only ceiling here that's actually a hard cap.
# Nothing security-critical is allowed to depend on one of these numbers
# being exact.
[[ratelimits]]
name = "RL_READ"
namespace_id = "1001"
simple = { limit = 300, period = 60 }

[[ratelimits]]
name = "RL_WRITE"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RL_UPLOAD"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_CREATE"
namespace_id = "1004"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "RL_REQUEST"
namespace_id = "1005"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "RL_REPORT"
namespace_id = "1006"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "RL_EMAIL"
namespace_id = "1007"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "RL_ADMIN"
namespace_id = "1008"
simple = { limit = 120, period = 60 }

# ============================================================================
# [env.preview] — one shared Worker per plan, its own D1/R2/KV/rate-limit
# namespaces so preview traffic (and its abuse) never touches production data.
# Every binding and every var is restated: Wrangler does not merge an env
# block with the top-level config for `[vars]` or any `[[...]]` binding.
# ============================================================================
[env.preview]
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[env.preview.assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/i/*", "/item/*", "/health", "/version.json", "/sitemap.xml", "/robots.txt"]

[env.preview.ai]
binding = "AI"

[env.preview.observability]
enabled = true
head_sampling_rate = 1

[[env.preview.send_email]]
name = "EMAIL"

[env.preview.vars]
ENVIRONMENT = "preview"
COMMIT_SHA = "dev"
# Estimated for real preview-scale traffic (issue #18) — see the top-level
# `[vars]` comment above for why this is charged per-photo now and why it
# differs from `[env.production]`.
MOD_TEXT_DAILY_BUDGET = "2000"
MOD_IMAGE_DAILY_BUDGET = "6000"
SUGGEST_DAILY_BUDGET = "1000"
LISTING_IP_DAILY_BUDGET = "20"
REQUEST_IP_DAILY_BUDGET = "20"
UPLOAD_IP_DAILY_BUDGET = "60"
SUGGEST_IP_DAILY_BUDGET = "30"
REPORT_AUTOHIDE_THRESHOLD = "3"
SHELF_MIN_ITEMS = "3"
MAX_PHOTO_BYTES = "5242880"
EMAIL_PROVIDER = "cf"
EMAIL_FROM = "Keepsake <hello@keepsake.ing>"
# Preview shares the verified keepsake.ing sender with production, so it is
# restricted to a named list. Anything else is recorded and dropped — a smoke
# test must never mail a stranger who typed their address into a request.
EMAIL_MODE = "allowlist"
EMAIL_ALLOWLIST = "kiarasha@alum.mit.edu,leapkg@gmail.com"
SITE_URL = "https://preview.keepsake.ing"
MOCK_AI = "0"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "keepsake-db-preview"
database_id = "2cfbc1c8-39b9-4653-814e-9fa737d1689f"
migrations_dir = "migrations"

[[env.preview.r2_buckets]]
binding = "BUCKET"
bucket_name = "keepsake-photos-preview"

[[env.preview.kv_namespaces]]
binding = "KV"
id = "42dc992cb79044d0936e0da7e93bcbbb"

[[env.preview.ratelimits]]
name = "RL_READ"
namespace_id = "2001"
simple = { limit = 300, period = 60 }

[[env.preview.ratelimits]]
name = "RL_WRITE"
namespace_id = "2002"
simple = { limit = 60, period = 60 }

[[env.preview.ratelimits]]
name = "RL_UPLOAD"
namespace_id = "2003"
simple = { limit = 10, period = 60 }

[[env.preview.ratelimits]]
name = "RL_CREATE"
namespace_id = "2004"
simple = { limit = 5, period = 60 }

[[env.preview.ratelimits]]
name = "RL_REQUEST"
namespace_id = "2005"
simple = { limit = 5, period = 60 }

[[env.preview.ratelimits]]
name = "RL_REPORT"
namespace_id = "2006"
simple = { limit = 5, period = 60 }

[[env.preview.ratelimits]]
name = "RL_EMAIL"
namespace_id = "2007"
simple = { limit = 5, period = 60 }

[[env.preview.ratelimits]]
name = "RL_ADMIN"
namespace_id = "2008"
simple = { limit = 120, period = 60 }

# ============================================================================
# [env.production]
# ============================================================================
[env.production]
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[env.production.assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/i/*", "/item/*", "/health", "/version.json", "/sitemap.xml", "/robots.txt"]

[env.production.ai]
binding = "AI"

[env.production.observability]
enabled = true
head_sampling_rate = 1

[[env.production.send_email]]
name = "EMAIL"

[env.production.vars]
ENVIRONMENT = "production"
# Issue #24: this "dev" fallback only ships if a human runs
# `wrangler deploy --env production` by hand without
# `--var COMMIT_SHA:$(git rev-parse HEAD)` — deploy.yml's automated path
# always overrides it (see below), so it never ships through CI. See
# docs/runbooks/deploy.md#manual-deploys-and-commit_sha-issue-24 for the
# required flag. Left as a real fallback (never removed) because
# `wrangler dev` needs *some* default and this is what every other
# environment block also falls back to. What changed: `src/index.ts`'s
# very first middleware now refuses every request in `production` — not
# just `/health` — the instant it sees `ENVIRONMENT === "production"` with
# this value still unset, so a hand-run deploy that forgets the flag fails
# loudly the moment anyone (or anything) hits the site, rather than serving
# real traffic under a false commit. `.github/workflows/uptime.yml`'s
# scheduled `/health` probe still also checks for this independently
# (belt-and-braces, and it fires even if nobody happens to hit the site in
# the interim) — same failure, two layers, neither able to skip the other.
COMMIT_SHA = "dev"
# Estimated for real launch-day traffic (issue #18), not measured — there is
# no production traffic yet to size against, which is the same gap the
# launch audit called out for the old, identical-everywhere numbers. Revisit
# once there's real usage to look at. See the top-level `[vars]` comment
# above for why MOD_IMAGE_DAILY_BUDGET reads much higher than before for the
# same real capacity (it's now per-photo, not per-listing).
MOD_TEXT_DAILY_BUDGET = "5000"
MOD_IMAGE_DAILY_BUDGET = "15000"
SUGGEST_DAILY_BUDGET = "1000"
LISTING_IP_DAILY_BUDGET = "20"
REQUEST_IP_DAILY_BUDGET = "20"
UPLOAD_IP_DAILY_BUDGET = "60"
SUGGEST_IP_DAILY_BUDGET = "30"
REPORT_AUTOHIDE_THRESHOLD = "3"
SHELF_MIN_ITEMS = "3"
MAX_PHOTO_BYTES = "5242880"
EMAIL_PROVIDER = "cf"
EMAIL_FROM = "Keepsake <hello@keepsake.ing>"
# Real users. Reserved domains (example.com, .test, .invalid) are still
# refused by guardRecipient; bounce rate is scored from 2%.
EMAIL_MODE = "live"
EMAIL_ALLOWLIST = ""
SITE_URL = "https://keepsake.ing"
MOCK_AI = "0"

[[env.production.d1_databases]]
binding = "DB"
database_name = "keepsake-db-production"
database_id = "ef57b121-265c-4e23-a0d9-c9b2c47cf689"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "BUCKET"
bucket_name = "keepsake-photos-production"

[[env.production.kv_namespaces]]
binding = "KV"
id = "595d0299545644e1b524ab3818eff90f"

[[env.production.ratelimits]]
name = "RL_READ"
namespace_id = "3001"
simple = { limit = 300, period = 60 }

[[env.production.ratelimits]]
name = "RL_WRITE"
namespace_id = "3002"
