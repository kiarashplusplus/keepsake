# ============================================================================
# [env.production]
# ============================================================================
[env.production]
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Kept as an explicit list rather than `true` (unlike dev/preview above):
# production doesn't need the noindex middleware to run on every static asset
# request, and routing every hashed `/_expo/static/*` fetch through the
# Worker first would be a real, needless cost on the live site. `/admin` is
# added here (issue #84) so the same middleware's admin-specific noindex
# override (`src/index.ts`) actually reaches that one page — it's a static
# SPA route like `/` or `/about` and was silently bypassing the Worker the
# same way those were on preview, just for a different reason (nobody wants
# `/admin` in production ever indexed, on top of the token gate).
[env.production.assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/i/*", "/item/*", "/health", "/version.json", "/sitemap.xml", "/robots.txt", "/admin"]

[env.production.ai]
binding = "AI"

# Index confirmed to exist 2026-09-07 (768/cosine) — see the top-level
# [[vectorize]] block. The binding resolving is what makes this deploy safe;
# whether search uses it is `SEMANTIC_SEARCH` in [env.production.vars].
[[env.production.vectorize]]
binding = "VECTORIZE"
index_name = "keepsake-listings-production"

[env.production.observability]
enabled = true
head_sampling_rate = 1

[[env.production.send_email]]
name = "EMAIL"

[env.production.vars]
ENVIRONMENT = "production"
# Issue #24: this "dev" fallback only ships if a human runs
# `wrangler deploy --env production` by hand without
# `--var COMMIT_SHA:$(git rev-parse HEAD)` — deploy.yml's automated path
# always overrides it (see below), so it never ships through CI. See
# docs/runbooks/deploy.md#manual-deploys-and-commit_sha-issue-24 for the
# required flag. Left as a real fallback (never removed) because
# `wrangler dev` needs *some* default and this is what every other
# environment block also falls back to. What changed: `src/index.ts`'s
# very first middleware now refuses every request in `production` — not
# just `/health` — the instant it sees `ENVIRONMENT === "production"` with
# this value still unset, so a hand-run deploy that forgets the flag fails
# loudly the moment anyone (or anything) hits the site, rather than serving
# real traffic under a false commit. `.github/workflows/uptime.yml`'s
# scheduled `/health` probe still also checks for this independently
# (belt-and-braces, and it fires even if nobody happens to hit the site in
# the interim) — same failure, two layers, neither able to skip the other.
COMMIT_SHA = "dev"
# Estimated for real launch-day traffic (issue #18), not measured — there is
# no production traffic yet to size against, which is the same gap the
# launch audit called out for the old, identical-everywhere numbers. Revisit
# once there's real usage to look at. See the top-level `[vars]` comment
# above for why MOD_IMAGE_DAILY_BUDGET reads much higher than before for the
# same real capacity (it's now per-photo, not per-listing).
MOD_TEXT_DAILY_BUDGET = "5000"
MOD_IMAGE_DAILY_BUDGET = "15000"
SUGGEST_DAILY_BUDGET = "1000"
EMBED_DAILY_BUDGET = "2000"
SEMANTIC_SEARCH = "1"  # issue #38, on — see top-level [vars]
LISTING_IP_DAILY_BUDGET = "20"
REQUEST_IP_DAILY_BUDGET = "20"
UPLOAD_IP_DAILY_BUDGET = "60"
REPORT_IP_DAILY_BUDGET = "10"
EMAIL_IP_DAILY_BUDGET = "10"
SUGGEST_IP_DAILY_BUDGET = "30"
REPORT_AUTOHIDE_THRESHOLD = "3"
SHELF_MIN_ITEMS = "3"
MAX_PHOTO_BYTES = "5242880"
EMAIL_PROVIDER = "cf"
EMAIL_FROM = "Keepsake <hello@keepsake.ing>"
# Real users. Reserved domains (example.com, .test, .invalid) are still
# refused by guardRecipient; bounce rate is scored from 2%.
EMAIL_MODE = "live"
EMAIL_ALLOWLIST = ""
SITE_URL = "https://keepsake.ing"
# The keepsake.ing zone (issue #94), attached to this account 2026-09-07 and
# recorded in `docs/runbooks/kiarash-checklist.md`. Inert until
# `CF_CACHE_PURGE_TOKEN` is set on the production Worker — see the top-level
# `[vars]` comment for the full rationale and for why an unset token is a
# silent no-op rather than an error.
CF_ZONE_ID = "dcc1fb09eeeba27a343fc1d98aff9094"
MOCK_AI = "0"

[[env.production.d1_databases]]
binding = "DB"
database_name = "keepsake-db-production"
database_id = "ef57b121-265c-4e23-a0d9-c9b2c47cf689"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "BUCKET"
bucket_name = "keepsake-photos-production"

[[env.production.kv_namespaces]]
binding = "KV"
id = "595d0299545644e1b524ab3818eff90f"

[[env.production.ratelimits]]
name = "RL_READ"
namespace_id = "3001"
simple = { limit = 300, period = 60 }

[[env.production.ratelimits]]
name = "RL_WRITE"
namespace_id = "3002"
simple = { limit = 60, period = 60 }

[[env.production.ratelimits]]
name = "RL_UPLOAD"
namespace_id = "3003"
simple = { limit = 10, period = 60 }

[[env.production.ratelimits]]
name = "RL_CREATE"
namespace_id = "3004"
simple = { limit = 5, period = 60 }

[[env.production.ratelimits]]
name = "RL_REQUEST"
namespace_id = "3005"
simple = { limit = 5, period = 60 }

[[env.production.ratelimits]]
name = "RL_REPORT"
namespace_id = "3006"
simple = { limit = 5, period = 60 }

[[env.production.ratelimits]]
name = "RL_EMAIL"
namespace_id = "3007"
simple = { limit = 5, period = 60 }

[[env.production.ratelimits]]
name = "RL_ADMIN"
namespace_id = "3008"
simple = { limit = 120, period = 60 }
