# ============================================================================
# [env.production]
# ============================================================================
[env.production]
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Issue #245 names preview. Production had the identical problem and it was
# worse, which nothing had noticed: `keepsake-production.leapkg.workers.dev`
# answered `/health` with `{"ok":true,...,"env":"production"}` — the live
# Worker, the live D1, the live R2, reachable on a hostname that is not this
# zone. Three consequences, in the order they matter:
#
#   1. It is off-zone. The free managed WAF ruleset, the DDoS L7 ruleset and
#      the www→apex redirect are all *zone* rulesets and none of them apply
#      there. Zone analytics do not see it either, so traffic to it is
#      traffic nobody is looking at.
#   2. It was indexable. The `X-Robots-Tag: noindex, nofollow` middleware in
#      `src/index.ts` keys on `ENVIRONMENT`, not on hostname — which is right
#      for its purpose and means production's clone is exempt by
#      construction. Verified against the live site on 2026-09-08:
#      `preview.keepsake.ing` sends the header, the production workers.dev
#      host sends nothing, and no page carries a `rel=canonical`. That is a
#      crawlable, brand-named duplicate of the whole product.
#   3. It bypasses Turnstile's domain allowlist as a *deny*, not an allow —
#      the widget is registered for `keepsake.ing` and `preview.keepsake.ing`
#      only, so a challenge cannot legitimately be solved on workers.dev.
#      That is protection by accident, and it is only protection at all where
#      the challenge is actually enforced (cf. #183).
#
# `preview_urls` matters just as much here: it is per-deploy, so every push
# to main was minting another permanent production-bound hostname.
workers_dev = false
preview_urls = false

# Kept as an explicit list rather than `true` (unlike dev/preview above):
# production doesn't need the noindex middleware to run on every static asset
# request, and routing every hashed `/_expo/static/*` fetch through the
# Worker first would be a real, needless cost on the live site. `/admin` is
# added here (issue #84) so the same middleware's admin-specific noindex
# override (`src/index.ts`) actually reaches that one page — it's a static
# SPA route like `/` or `/about` and was silently bypassing the Worker the
# same way those were on preview, just for a different reason (nobody wants
# `/admin` in production ever indexed, on top of the token gate).
[env.production.assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/i/*", "/item/*", "/og/*", "/health", "/version.json", "/sitemap.xml", "/robots.txt", "/admin"]

[env.production.ai]
binding = "AI"

# Index confirmed to exist 2026-09-07 (768/cosine) — see the top-level
# [[vectorize]] block. The binding resolving is what makes this deploy safe;
# whether search uses it is `SEMANTIC_SEARCH` in [env.production.vars].
[[env.production.vectorize]]
binding = "VECTORIZE"
index_name = "keepsake-listings-production"

[env.production.observability]
enabled = true
head_sampling_rate = 1

[[env.production.send_email]]
name = "EMAIL"

[env.production.vars]
ENVIRONMENT = "production"
# Issue #24: this "dev" fallback only ships if a human runs
# `wrangler deploy --env production` by hand without
# `--var COMMIT_SHA:$(git rev-parse HEAD)` — deploy.yml's automated path
# always overrides it (see below), so it never ships through CI. See
# docs/runbooks/deploy.md#manual-deploys-and-commit_sha-issue-24 for the
# required flag. Left as a real fallback (never removed) because
# `wrangler dev` needs *some* default and this is what every other
# environment block also falls back to. What changed: `src/index.ts`'s
# very first middleware now refuses every request in `production` — not
# just `/health` — the instant it sees `ENVIRONMENT === "production"` with
# this value still unset, so a hand-run deploy that forgets the flag fails
# loudly the moment anyone (or anything) hits the site, rather than serving
# real traffic under a false commit. `.github/workflows/uptime.yml`'s
# scheduled `/health` probe still also checks for this independently
# (belt-and-braces, and it fires even if nobody happens to hit the site in
# the interim) — same failure, two layers, neither able to skip the other.
COMMIT_SHA = "dev"
# Raised 4x on 2026-09-07 (Kiarash's call), from 5000/15000. Not because
# more traffic is expected — because these were sized *near* an estimate of
# launch-day traffic, and that is the wrong thing for them to be. They are
# runaway protection: Workers AI meters its own allocation regardless of
# what is set here, so the only thing a tight number buys is the chance of
# hitting it. And the cost of hitting it is not a throttle, it is an
# outage with a bad shape — `moderation/pipeline.ts` leaves every listing
# that arrives after the budget is spent sitting in `pending`, invisible to
# the feed, until the counter rolls at midnight UTC. A giver who posted at
# 14:00 sees nothing happen for ten hours and has no way to tell whether
# they did something wrong. So the number should sit far past any plausible
# day and catch only a scraper or a retry loop, which is what it was for.
#
# Still estimated rather than measured (issue #18) — there is no production
# traffic yet to size against, which is exactly why the safe direction is
# up. Revisit with real usage. See the top-level `[vars]` comment above for
# why MOD_IMAGE_DAILY_BUDGET reads so much higher than the text one for the
# same real capacity (it is charged per photo, not per listing).
#
# `[env.preview]` above is deliberately left lower (6000/18000): preview is
# allowlisted QA traffic, nobody's listing is stranded there in a way that
# matters, and a low ceiling there is a cheap way to find out this code path
# still works.
#
# SUGGEST_DAILY_BUDGET and EMBED_DAILY_BUDGET raised 2026-09-08 alongside the
# per-IP pass below — they had been left behind by the 2026-09-07 4x raise
# above (SUGGEST/EMBED were never touched, so production sat *below*
# preview's 2500/4000, backwards from every other budget on this page, which
# scales up from preview to production). Same "runaway protection, not a
# product tier" reasoning as MOD_TEXT/MOD_IMAGE: Workers AI meters its own
# allocation regardless of what's set here, this is a paid Cloudflare account
# where the actual spend is cheap (SUGGEST is ~$0.17/1000 calls per the
# top-level `[vars]` comment), and the failure mode of a tight ceiling is an
# outage-shaped one (autofill/search degrade silently), not a cost save.
MOD_TEXT_DAILY_BUDGET = "40000"
MOD_IMAGE_DAILY_BUDGET = "120000"
SUGGEST_DAILY_BUDGET = "5000"
EMBED_DAILY_BUDGET = "8000"
SEMANTIC_SEARCH = "1"  # issue #38, on — see top-level [vars]
# Per-IP ceilings raised 5x on 2026-09-08 (Kiarash's call): these are
# anti-abuse, not cost — they don't spend the Workers AI allocation the way
# the budgets above do — and 20/day for a shared household or CGNAT address
# was landing on real givers, not just scripts. The old numbers (20/20/60,
# reports and email at 10) were sized against zero real traffic; these give
# real households room without opening the door any wider to an actual
# scraper, which these ceilings were never the only defense against anyway
# (`burst()` above and the moderation pipeline's own budget still apply).
LISTING_IP_DAILY_BUDGET = "100"
REQUEST_IP_DAILY_BUDGET = "100"
UPLOAD_IP_DAILY_BUDGET = "300"
REPORT_IP_DAILY_BUDGET = "50"
EMAIL_IP_DAILY_BUDGET = "50"
# Issue #188, and the odd one out on this page: every other ceiling here is
# keyed by the *caller's* address and answers "how much may this client do?".
# This one is keyed by the **recipient's** address and answers "how much mail
# can arrive at one inbox today, from anyone?" — the only question a per-IP
# number cannot answer, because the attacker and the person harmed are not the
# same party and an attacker can always find more IPs. Left at 3 in the
# 2026-09-08 pass above: raising it loosens how much a *stranger's* inbox can
# be mailed by unrelated requesters, which is not the "crippling real users"
# problem the other ceilings on this page had. Three "did you ask for this?"
# confirmations a day, per address, from everyone combined. See
# `DEFAULT_REQUEST_CONFIRM_ADDRESS_DAILY_BUDGET` in src/routes/listings.ts.
REQUEST_CONFIRM_ADDRESS_DAILY_BUDGET = "3"
SUGGEST_IP_DAILY_BUDGET = "150"
REPORT_AUTOHIDE_THRESHOLD = "3"
SHELF_MIN_ITEMS = "3"
MAX_PHOTO_BYTES = "5242880"
# The `thumb` variant's own, tighter ceiling. Both variants used to share
# MAX_PHOTO_BYTES, so a caller could store a 5 MiB "thumbnail" and have it
# served from /i/:id/thumb and base64'd into a vision prompt. Read by
# `src/routes/photos.ts` via `parseIntVar`.
MAX_THUMB_BYTES = "786432"
EMAIL_PROVIDER = "cf"
EMAIL_FROM = "Keepsake <hello@keepsake.ing>"
# Real users. Reserved domains (example.com, .test, .invalid) are still
# refused by guardRecipient; bounce rate is scored from 2%.
EMAIL_MODE = "live"
EMAIL_ALLOWLIST = ""
SITE_URL = "https://keepsake.ing"
# The keepsake.ing zone (issue #94), attached to this account 2026-09-07 and
# recorded in `docs/runbooks/kiarash-checklist.md`. Inert until
# `CF_CACHE_PURGE_TOKEN` is set on the production Worker — see the top-level
