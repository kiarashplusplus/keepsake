BULK_UPLOAD = "1"
BULK_GRANT_TTL_HOURS = "72"
BULK_MAX_ITEMS_PER_BATCH = "100"
BULK_MAX_PHOTOS_PER_BATCH = "300"
BULK_OWNER_DAILY_ITEMS = "150"
BULK_OWNER_DAILY_PHOTOS = "450"
BULK_DRAFT_RETENTION_DAYS = "7"

[[env.production.d1_databases]]
