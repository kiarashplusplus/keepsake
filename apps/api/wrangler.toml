EMAIL_MODE = "allowlist"
EMAIL_ALLOWLIST = "kiarasha@alum.mit.edu,leapkg@gmail.com"
SITE_URL = "https://preview.keepsake.ing"
# Same keepsake.ing zone as production (issue #94): `preview.keepsake.ing`
