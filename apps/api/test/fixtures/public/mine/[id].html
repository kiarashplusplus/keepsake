  `/mine/<a real id>` and, under `404-page` handling, the assets binding
  misses there. `src/index.ts`'s catch-all substitutes this file; the marker
  in the body is how `test/notFound.test.ts` tells it apart from `index.html`,
  which is what the old SPA fallback would have returned.
-->
