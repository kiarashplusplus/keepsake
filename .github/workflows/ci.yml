name: CI

# Bayan/Finderly lesson carried in: gate expensive jobs behind cheap ones.
# `preflight` always runs (it costs seconds and catches whole classes of
# mistake — see tools/preflight/preflight.mjs); `changes` decides what else
# is worth running; everything downstream is scoped to what actually moved.
#
# **The shape is a fan, not a chain.** Every job below hangs off `changes`
# alone, and the two genuine dependencies — e2e needs the bundle build-web
# uploads, and no job is worth paying for once the unit tests are red — are
# expressed on `e2e` as an explicit `if:`. It used to be a six-deep chain
# (changes -> preflight -> lint/typecheck -> test-* -> build-web -> e2e), and
# measuring it on 2026-09-07 showed what that cost: of 488s on the critical
# path of run 34132108162, only 307s was work. The other 181s — 37% — was the
# same runner boot, checkout, setup-node and `pnpm install` paid six times in
# series, because each stage waited for a stage it did not actually need.
#
# The chain also cost a whole extra round trip on any pull request with a
# lint error: test-*, build-web and e2e all skipped, so you fixed the lint,
# pushed, and waited another eight minutes to find out whether the tests
# passed. Now one run tells you everything that is wrong at once, which is
# the thing that actually shortens a development cycle.
#
# What that buys, and what it costs: on a green run the critical path is
# `changes -> build-web -> e2e` instead of all six stages. The cost is
# speculative work — build-web and the test jobs run even when lint has
# already gone red. That is the deliberate trade, and it is affordable here:
# these runs queue for ~0s, so the spend is minutes, not waiting.
on:
  pull_request:
  push:
    branches: [main]
  # Runs every job regardless of what changed — the way to prove the pipeline
  # still works after editing these files.
  workflow_dispatch:

# Cancel superseded runs for a pull request; never cancel — or queue — a run
# for a commit that has already landed.
#
# The old group was `ci-${{ github.ref }}`. On a pull request that ref is
# unique (`refs/pull/N/merge`), so it did what it was meant to. On `main`
# every push shares `refs/heads/main`, so the group was a single bucket and
# each merge cancelled the previous merge's run. Three consecutive `main`
# pushes ended `cancelled` on 2026-09-07 (#103), and `deploy.yml` has no
# `needs:` on CI and does not share this group, so every one of those commits
# shipped to preview with no completed run against its merged state.
#
# `cancel-in-progress: false` alone would not have fixed it: GitHub holds at
# most **one pending run** per group, so with three merges in a row the third
# cancels the second while it is still queued — the same bug, one step later.
# The only shape that always completes is a bucket of one, hence `run_id` for
# every event that is not a pull request. `workflow_dispatch` lands there too:
# a manual "prove the pipeline still works" run should neither cancel nor wait
# behind a merge.
#
# The `cond && a || b` idiom is unsafe when the true-branch is falsy (see
# ci-complete's CHANGED below); `github.ref` is never empty on a pull request,
# so it is safe here.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22

# `dorny/paths-filter` asks the API for a pull request's changed files, which
# needs `pull-requests: read`. Without it the action fails with "Resource not
# accessible by integration", the `changes` job goes red, and — because every
# other job depends on its outputs — lint, typecheck and every test **skip**.
# A pull request then shows mostly-green with no tests having run at all.
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      packages: ${{ steps.filter.outputs.packages }}
      tools: ${{ steps.filter.outputs.tools }}
      site: ${{ steps.filter.outputs.site }}
      root: ${{ steps.filter.outputs.root }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - "apps/web/**"
            api:
              - "apps/api/**"
            packages:
              - "packages/**"
            tools:
              - "tools/**"
              - ".github/workflows/**"
            # The marketing pages are not a separate deployable: copy-site.mjs
            # copies apps/site/public/* into the web bundle, and consent.spec
            # and a11y.spec drive those exact pages. Before this filter existed
            # `apps/site/**` matched nothing, so a pull request touching only
            # privacy.html ran no job at all and still reported green.
            site:
              - "apps/site/**"
            # A lockfile or workspace change can break a package the diff never
            # mentions, so it has to run everything.
            root:
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "tsconfig.base.json"
              - ".npmrc"
            docs:
              - "docs/**"
              - "README.md"

  preflight:
    name: preflight
    runs-on: ubuntu-latest
    # Always runs, regardless of `changes` — it's the cheapest check in the
    # workflow and the one most likely to catch a mistake made in a package
    # this PR didn't otherwise touch (e.g. a stray "@cf/" model id, or a
    # migration numbering gap).
    steps:
      - uses: actions/checkout@v4
        with:
          # LFS bandwidth is metered; only preflight needs the real seed file
          # (its lfs-pointers check). Every other job seeds its own rows.
          lfs: true
          # The `migration-drift` check compares apps/api/migrations against
          # `merge-base(origin/main, HEAD)`: D1's `d1_migrations` ledger is
          # keyed on the *filename*, so renaming or editing a migration that a
          # deploy already applied silently corrupts it (#99). The default
          # shallow, single-ref checkout has no `origin/main` and no shared
          # history, so the check would have nothing to compare against.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Belt and braces: `fetch-depth: 0` already brings every branch, but a
      # fork or a re-run against a pruned cache may not have `origin/main`.
      # Fetching it explicitly means `migration-drift` fails on real drift
      # rather than on a missing ref.
      - name: Fetch the migration baseline
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      # GITHUB_ACTIONS is already "true" here, which is what turns
      # `migration-drift`'s "I could not resolve a baseline" SKIP into a
      # FAIL — a check that silently passes when it cannot run is the exact
      # failure mode AGENTS.md catalogues. Set explicitly so the intent
      # survives someone running this workflow's steps elsewhere.
      - run: node tools/preflight/preflight.mjs
        env:
          PREFLIGHT_REQUIRE_GIT_BASELINE: "1"

  lint:
    name: lint
    runs-on: ubuntu-latest
    # Not `needs: preflight`. preflight is a one-second script wrapped in
    # ~23s of checkout and install, and nothing lint does depends on it —
    # so gating on it only ever moved the whole workflow 23s to the right.
    # Both run from t=0 now, and a preflight failure still fails the run.
    needs: [changes]
    # Skip when the change is docs-only — nothing lint checks changed.
    #
    # `site` is in this list because `eslint .` genuinely covers
    # apps/site/public/consent.js, which is real JavaScript.
    #
    # It used to be here for a second, load-bearing reason: test-web `needs`
    # lint, GitHub skips a job when any of its needs skipped, so omitting
    # `site` here took test-web, build-web and e2e down with it and a
    # site-only pull request ran no tests at all (#56, caught by
    # ci-complete). That cascade is gone — every job carries its own
    # condition now — so this list is only about what eslint reads. The
    # invariant #56 broke is still enforced, by ci-complete rather than by
    # the shape of the graph.
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.tools == 'true' || needs.changes.outputs.root == 'true' || needs.changes.outputs.site == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    # Same as lint: preflight is not a prerequisite, only a delay.
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.tools == 'true' || needs.changes.outputs.root == 'true' || needs.changes.outputs.site == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present typecheck

  test-packages:
    name: test-packages
    runs-on: ubuntu-latest
    # Not `needs: [lint, typecheck]`. A lint error does not make a test
    # result untrue, and waiting for one costs both wall-clock time and —
    # worse — a whole extra CI round to learn whether the tests pass.
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.root == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/*" --if-present test

  # tools/* are workspace packages too (pnpm-workspace.yaml lists `tools/*`),
  # but `test-packages` filters on `./packages/*` and never matched them. So
  # tools/preflight/preflight.test.mjs — 55 tests whose whole purpose is to
  # prove each preflight check can still fail — had never executed in CI. That
  # is this repo's recurring failure mode, found again while fixing #99.
  test-tools:
    name: test-tools
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.tools == 'true' || needs.changes.outputs.root == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./tools/*" --if-present test

  test-api:
    name: test-api
    runs-on: ubuntu-latest
    needs: [changes]
    # A change to a shared package (contracts/observability) can break the
    # API even though apps/api itself didn't change.
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.root == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @keepsake/api --if-present test

  test-web:
    name: test-web
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.tools == 'true' || needs.changes.outputs.site == 'true' || needs.changes.outputs.root == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @keepsake/web --if-present test

  build-web:
    name: build-web
    runs-on: ubuntu-latest
    # This is the one edge whose removal actually shortens the workflow.
    # `expo export` is 87s and it is the second half of the critical path;
    # it used to wait for test-web (47s) which waited for lint and typecheck
    # (52s) which waited for preflight (24s) — ~120s of queueing in front of
    # a build that depends on none of it. Hanging it off `changes` instead
    # starts it at t≈9s, and e2e — the expensive job — begins ~2 minutes
    # earlier.
    #
    # The condition is test-web's, copied rather than inherited. That is what
    # the old `needs: [test-web]` was really buying: the scoping, via the skip
    # cascade. `tools` is in it, so editing this file still runs the pipeline
    # this file describes; `site` is in it, so a change to privacy.html still
    # reaches the specs that drive it (#56). Widen one of these and you must
    # widen the other — and if you forget, ci-complete says so rather than
    # reporting green.
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.tools == 'true' || needs.changes.outputs.site == 'true' || needs.changes.outputs.root == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @keepsake/web export
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # Needs the bundle `build-web` uploads (the Worker serves it through its
    # [assets] binding), and there is no point paying for a browser run when
    # the unit tests are already red.
    #
    # The explicit `if` is load-bearing: GitHub skips a job when *any* of its
    # `needs` is skipped, and `test-api` only runs when `apps/api/**` changed.
    # Without this, every web-only change skipped the end-to-end suite —
    # precisely the change it exists to check. It ran on nothing for its first
    # several commits. So: require `build-web` to have passed, and allow the
    # unit-test jobs to be either passed or skipped, but never failed.
    #
    # `test-web` is named here explicitly now. It used to reach e2e for free,
    # because build-web `needs: [test-web]` and a failed need skips the job.
    # build-web hangs off `changes` instead (see there for why), so that free
    # ride is gone and the guard has to be written down. It costs nothing on
    # the clock: test-web finishes around t≈56s and build-web around t≈159s,
    # so e2e was never going to start any earlier.
    #
    # Deliberately *not* guarded on lint or typecheck. A lint error does not
    # make an end-to-end result untrue, and the whole point of the fan shape
    # above is that one run tells you everything that is wrong at once.
    needs: [build-web, test-api, test-web]
    if: ${{ !cancelled() && needs.build-web.result == 'success' && needs.test-api.result != 'failure' && needs.test-web.result != 'failure' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      # `playwright install` downloads ~170MB of Chromium into
      # ~/.cache/ms-playwright on every run, and that download is the widest
      # variance in this whole workflow: 23s on a good day, **12m36s** on
      # 2026-09-07 (run 34132870851, job 101778171822, 14:30:04 -> 14:42:40),
      # which alone turned an 8-minute `main` run into a 20-minute one. It is
      # also on the critical path — nothing else is running by the time e2e
      # starts.
      #
      # Keyed on the lockfile, which is what pins @playwright/test, with a
      # prefix restore-key so a lockfile bump that does *not* move Playwright
      # still hits the previous cache. On a genuine version bump the restore
      # is stale, `playwright install` downloads the new browser as it always
      # did, and the new key saves it — a miss costs exactly today's
      # behaviour, never more.
      #
      # The command below is unchanged: `playwright install` is a no-op for a
      # browser already present in the cache directory, so a hit leaves only
      # the `--with-deps` apt step. That also means a partial or corrupt cache
      # self-heals rather than producing a missing-browser failure.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ms-playwright-${{ runner.os }}-
      - run: pnpm --filter @keepsake/web e2e:install
      # `wrangler dev --local` keeps every binding local (D1/R2/KV in a
      # throwaway --persist-to directory, no remote AI), so this needs no
      # Cloudflare credentials — see apps/web/playwright.config.ts.
      - run: pnpm --filter @keepsake/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # The one job that always runs. Everything above is gated on `changes`, and
  # GitHub reports a skipped job as a green check — so a mistake in the filters
  # produces a pull request that looks fully tested and ran nothing. That has
  # happened three times here (see tools/ci/assert-coverage.mjs). This asserts
  # the invariant rather than trusting the gating: if a filter says an area
  # changed, the jobs covering that area must actually have run.
  #
  # `always()` includes cancellation, and assert-coverage.mjs already treats a
  # cancelled need as a problem ("was cancelled, so it proved nothing"). That
  # pairing worked: in the cancelled `main` run 34087808060 this job ran and
  # went red (job 101635416402). What nobody saw is that the *run*'s conclusion
  # is `cancelled`, not `failure` — GitHub reports the run by its cancelled
  # jobs, so the one job shouting about it was invisible to anything reading
  # conclusions. Fixed at the source above: `main` runs are no longer cancelled,
  # so a bad one now ends `failure` where a human or a branch rule can see it.
  ci-complete:
    name: ci-complete
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, preflight, lint, typecheck, test-packages, test-tools, test-api, test-web, build-web, e2e]
    steps:
      - uses: actions/checkout@v4
      - name: Assert CI ran what the diff required
        env:
          # Built from the filter outputs, not from a ternary. GitHub's
          # `cond && 'a' || 'b'` idiom is unsafe when the true-branch is an
          # empty string, because '' is falsy and the expression falls through
          # to the false-branch. On `workflow_dispatch` every job runs
          # unconditionally, so whatever this evaluates to is satisfied anyway.
          # A trailing comma is harmless; the script drops empty entries.
          CHANGED: >-
            ${{ format('{0}{1}{2}{3}{4}{5}',
                 needs.changes.outputs.web == 'true' && 'web,' || '',
                 needs.changes.outputs.api == 'true' && 'api,' || '',
                 needs.changes.outputs.packages == 'true' && 'packages,' || '',
                 needs.changes.outputs.tools == 'true' && 'tools,' || '',
                 needs.changes.outputs.site == 'true' && 'site,' || '',
                 needs.changes.outputs.root == 'true' && 'root' || '') }}
          # Index syntax rather than `needs.test-web.result`: unambiguous for
          # job ids containing a hyphen.
          JOBS: >-
            changes=${{ needs.changes.result }},preflight=${{ needs.preflight.result }},lint=${{ needs.lint.result }},typecheck=${{ needs.typecheck.result }},test-packages=${{ needs['test-packages'].result }},test-tools=${{ needs['test-tools'].result }},test-api=${{ needs['test-api'].result }},test-web=${{ needs['test-web'].result }},build-web=${{ needs['build-web'].result }},e2e=${{ needs.e2e.result }}
        run: node tools/ci/assert-coverage.mjs
