name: CI

# Bayan/Finderly lesson carried in: gate expensive jobs behind cheap ones.
# `preflight` always runs (it costs seconds and catches whole classes of
# mistake — see tools/preflight/preflight.mjs); `changes` decides what else
# is worth running; everything downstream is scoped to what actually moved,
# and GitHub's default "a skipped need skips its dependents" cascades that
# scoping all the way to build-web and e2e without repeating conditions.
on:
  pull_request:
  push:
    branches: [main]
  # Runs every job regardless of what changed — the way to prove the pipeline
  # still works after editing these files.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

# `dorny/paths-filter` asks the API for a pull request's changed files, which
# needs `pull-requests: read`. Without it the action fails with "Resource not
# accessible by integration", the `changes` job goes red, and — because every
# other job depends on its outputs — lint, typecheck and every test **skip**.
# A pull request then shows mostly-green with no tests having run at all.
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      packages: ${{ steps.filter.outputs.packages }}
      tools: ${{ steps.filter.outputs.tools }}
      site: ${{ steps.filter.outputs.site }}
      root: ${{ steps.filter.outputs.root }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - "apps/web/**"
            api:
              - "apps/api/**"
            packages:
              - "packages/**"
            tools:
              - "tools/**"
              - ".github/workflows/**"
            # The marketing pages are not a separate deployable: copy-site.mjs
            # copies apps/site/public/* into the web bundle, and consent.spec
            # and a11y.spec drive those exact pages. Before this filter existed
            # `apps/site/**` matched nothing, so a pull request touching only
            # privacy.html ran no job at all and still reported green.
            site:
              - "apps/site/**"
            # A lockfile or workspace change can break a package the diff never
            # mentions, so it has to run everything.
            root:
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "tsconfig.base.json"
              - ".npmrc"
            docs:
              - "docs/**"
              - "README.md"

  preflight:
    name: preflight
    runs-on: ubuntu-latest
    # Always runs, regardless of `changes` — it's the cheapest check in the
    # workflow and the one most likely to catch a mistake made in a package
    # this PR didn't otherwise touch (e.g. a stray "@cf/" model id, or a
    # migration numbering gap).
    steps:
      - uses: actions/checkout@v4
        with:
          # LFS bandwidth is metered; only preflight needs the real seed file
          # (its lfs-pointers check). Every other job seeds its own rows.
          lfs: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/preflight/preflight.mjs

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: [preflight, changes]
    # Skip when the change is docs-only — nothing lint checks changed.
    #
    # `site` is in this list for two reasons. `eslint .` does cover
    # apps/site/public/consent.js, which is real JavaScript. But the
    # load-bearing reason is the skip cascade: test-web `needs` lint and
    # typecheck, and GitHub skips a job when any of its needs skipped. So
    # naming `site` on test-web alone did nothing — lint skipping took
    # test-web, build-web and e2e down with it, and a site-only pull
    # request still ran no tests. ci-complete caught exactly that on #56.
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.tools == 'true' || needs.changes.outputs.root == 'true' || needs.changes.outputs.site == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    needs: [preflight, changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.tools == 'true' || needs.changes.outputs.root == 'true' || needs.changes.outputs.site == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present typecheck

  test-packages:
    name: test-packages
    runs-on: ubuntu-latest
    needs: [lint, typecheck, changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.root == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/*" --if-present test

  test-api:
    name: test-api
    runs-on: ubuntu-latest
    needs: [lint, typecheck, changes]
    # A change to a shared package (contracts/observability) can break the
    # API even though apps/api itself didn't change.
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.root == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @keepsake/api --if-present test

  test-web:
    name: test-web
    runs-on: ubuntu-latest
    needs: [lint, typecheck, changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.tools == 'true' || needs.changes.outputs.site == 'true' || needs.changes.outputs.root == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @keepsake/web --if-present test

  build-web:
    name: build-web
    runs-on: ubuntu-latest
    # No extra `if`: GitHub skips this automatically whenever test-web is
    # skipped, so build-web and e2e inherit test-web's scoping — which now
    # includes changes under tools/ and .github/workflows/, so editing the
    # pipeline actually runs the pipeline.
    needs: [test-web]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @keepsake/web export
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # Needs the bundle `build-web` uploads (the Worker serves it through its
    # [assets] binding), and there is no point paying for a browser run when
    # the API's own unit tests are red.
    #
    # The explicit `if` is load-bearing: GitHub skips a job when *any* of its
    # `needs` is skipped, and `test-api` only runs when `apps/api/**` changed.
    # Without this, every web-only change skipped the end-to-end suite —
    # precisely the change it exists to check. It ran on nothing for its first
    # several commits. So: require `build-web` to have passed, and allow
    # `test-api` to be either passed or skipped, but never failed.
    needs: [build-web, test-api]
    if: ${{ !cancelled() && needs.build-web.result == 'success' && needs.test-api.result != 'failure' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - run: pnpm --filter @keepsake/web e2e:install
      # `wrangler dev --local` keeps every binding local (D1/R2/KV in a
      # throwaway --persist-to directory, no remote AI), so this needs no
      # Cloudflare credentials — see apps/web/playwright.config.ts.
      - run: pnpm --filter @keepsake/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # The one job that always runs. Everything above is gated on `changes`, and
  # GitHub reports a skipped job as a green check — so a mistake in the filters
  # produces a pull request that looks fully tested and ran nothing. That has
  # happened three times here (see tools/ci/assert-coverage.mjs). This asserts
  # the invariant rather than trusting the gating: if a filter says an area
  # changed, the jobs covering that area must actually have run.
  ci-complete:
    name: ci-complete
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, preflight, lint, typecheck, test-packages, test-api, test-web, build-web, e2e]
    steps:
      - uses: actions/checkout@v4
      - name: Assert CI ran what the diff required
        env:
          # Built from the filter outputs, not from a ternary. GitHub's
          # `cond && 'a' || 'b'` idiom is unsafe when the true-branch is an
          # empty string, because '' is falsy and the expression falls through
          # to the false-branch. On `workflow_dispatch` every job runs
          # unconditionally, so whatever this evaluates to is satisfied anyway.
          # A trailing comma is harmless; the script drops empty entries.
          CHANGED: >-
            ${{ format('{0}{1}{2}{3}{4}{5}',
                 needs.changes.outputs.web == 'true' && 'web,' || '',
                 needs.changes.outputs.api == 'true' && 'api,' || '',
                 needs.changes.outputs.packages == 'true' && 'packages,' || '',
                 needs.changes.outputs.tools == 'true' && 'tools,' || '',
                 needs.changes.outputs.site == 'true' && 'site,' || '',
                 needs.changes.outputs.root == 'true' && 'root' || '') }}
          # Index syntax rather than `needs.test-web.result`: unambiguous for
          # job ids containing a hyphen.
          JOBS: >-
            changes=${{ needs.changes.result }},preflight=${{ needs.preflight.result }},lint=${{ needs.lint.result }},typecheck=${{ needs.typecheck.result }},test-packages=${{ needs['test-packages'].result }},test-api=${{ needs['test-api'].result }},test-web=${{ needs['test-web'].result }},build-web=${{ needs['build-web'].result }},e2e=${{ needs.e2e.result }}
        run: node tools/ci/assert-coverage.mjs
