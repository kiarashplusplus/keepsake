name: Backup photos

# Issue #17: R2 has no native object versioning to enable (checked directly —
# see docs/runbooks/restore.md#r2-photo-backup for the exact `wrangler r2
# bucket --help` output and reasoning). `tools/backup-photos.mjs` is the
# honest alternative: it copies every photo currently referenced by a
# `photos` row into a second, same-account bucket (`<name>-backup`) that
# nothing else ever deletes from, so a bug in one of orphanSweep's delete
# predicates (apps/api/src/cron/orphanSweep.ts) doesn't take a photo with it
# permanently. It does NOT protect against an account-level failure — both
# buckets are in the one Cloudflare account — see restore.md for why that is
# accepted for now rather than solved.
#
# **The ordering is not this schedule's job any more** (issue #178). This
# comment used to say the run at 03:00 is what keeps a photo safe from
# orphanSweep's 03:17 cron — 17 minutes of margin against a queue GitHub
# documents as best-effort. Measured drift on this repository is routinely
# larger than that (report-pressure has started up to 18 minutes late), and
# the single scheduled run this workflow has ever had started at 03:18,
# *after* the sweep's trigger. A fixed offset between two independent
# schedulers is a bet, and this one had already lost.
#
# So `orphanSweep` now refuses to delete a photo whose keys are not already
# in the backup bucket (`PHOTO_BACKUP_BUCKET` in wrangler.toml,
# `isBackedUp` in apps/api/src/cron/orphanSweep.ts). A late backup delays a
# deletion by a night instead of losing the bytes, and the deferral is
# counted in the sweep's own log line.
#
# 01:00 rather than 03:00 is belt-and-braces on top of that, not the safety
# argument: it just means a photo that became eligible overnight is usually
# copied before the sweep looks at it, so deletions are not routinely
# deferred a day. Nothing breaks if this drifts past 03:17 now.
#
# Runs against both tiers from one workflow, each against its own D1/R2 via
# its GitHub Environment's secrets — same credentials deploy.yml uses, nothing
# new to provision. Gated on the same `DEPLOY_ENABLED` variable as deploy.yml:
# that variable is already the repo's signal that the Cloudflare resources
# and CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID secrets actually exist for a
# given environment.
#
# The schedule is proven: this fired on its `schedule:` trigger for the first
# time on 2026-09-07 03:18 UTC (run 34079182574), both legs green. (GitHub
# evaluates neither `schedule:` nor `workflow_dispatch` for a workflow file
# that has never been merged to the default branch, which is why the original
# proof in restore.md is a by-hand run of the script.)
#
# But read what a green leg means here. That first production leg's entire
# log was "0 referenced key(s) in D1": no photos rows yet, so it copied
# nothing, touched no bucket, and passed — a check mark that said nothing
# about whether keepsake-photos-production-backup even exists. The script now
# probes the backup bucket up front and exits 1 when it cannot confirm it, so
# a green run means at least "the destination exists". It still does not mean
# "photos are backed up" unless `copied` is non-zero: read the log.
on:
  schedule:
    # 01:00 UTC. See the ordering note above: this is latency, not safety.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: Which tier to back up (leave default to run both)
        type: choice
        options: [both, preview, production]
        default: both
        required: true

concurrency:
  group: backup-photos
  cancel-in-progress: false

jobs:
  backup:
    name: backup (${{ matrix.env }})
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    environment: ${{ matrix.env }}
    strategy:
      fail-fast: false
      matrix:
        env: [preview, production]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Copy referenced photos into the backup bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # workflow_dispatch can target a single tier; skip the other matrix
        # leg rather than running a job whose environment nobody asked for.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.environment == 'both' || inputs.environment == matrix.env }}
        run: node tools/backup-photos.mjs --env ${{ matrix.env }}
