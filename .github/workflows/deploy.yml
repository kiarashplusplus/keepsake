name: Deploy

# Gated by `vars.DEPLOY_ENABLED` on the whole job, so the workflow is inert
# until the account is wired up.
#
# Preview deploys itself on every PR and every push to main. **Production is
# manual only** (`workflow_dispatch`): GitHub's required-reviewers gate is a
# paid feature on private repos, so "merge to main ships to the public site"
# would have had nothing standing in front of it. Ship production by running
# this workflow from the Actions tab and choosing `production`.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Which tier to deploy
        type: choice
        options: [preview, production]
        default: preview
        required: true

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'preview' }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  # Preview is one shared Worker with its own D1/R2/KV (see wrangler.toml
  # [env.preview]); production is the keepsake.ing Worker.
  DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'preview' }}

jobs:
  deploy:
    name: deploy (${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'preview' }})
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'preview' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # EXPO_PUBLIC_* values are baked into the static export at build time,
      # so they come from this GitHub Environment's variables — never from
      # secrets (see docs/design/README.md#barrel-ban's neighbor rule in
      # tools/preflight's public-env check: nothing EXPO_PUBLIC_* may be a
      # secret, because this step bakes it into a public bundle).
      - name: Export web
        env:
          EXPO_PUBLIC_SITE_URL: ${{ vars.EXPO_PUBLIC_SITE_URL }}
          EXPO_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.EXPO_PUBLIC_TURNSTILE_SITE_KEY }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_CF_WEB_ANALYTICS_TOKEN: ${{ vars.EXPO_PUBLIC_CF_WEB_ANALYTICS_TOKEN }}
          EXPO_PUBLIC_ENV: ${{ env.DEPLOY_ENV }}
          COMMIT_SHA: ${{ github.sha }}
        run: pnpm --filter @keepsake/web export

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @keepsake/api exec wrangler d1 migrations apply keepsake-db-${{ env.DEPLOY_ENV }} --env ${{ env.DEPLOY_ENV }} --remote

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @keepsake/api exec wrangler deploy --env ${{ env.DEPLOY_ENV }} --var COMMIT_SHA:${{ github.sha }}

      # Polls rather than asking once: `wrangler deploy` returns as soon as the
      # upload is accepted, and the new version reaches every edge a few
      # seconds later. The first run of this workflow checked one second after
      # upload, got the previous commit from a stale colo, and failed a deploy
      # that had actually worked.
      - name: Verify /health reports this commit
        run: |
          set -uo pipefail
          url="${{ vars.EXPO_PUBLIC_SITE_URL }}/health"
          expected="${{ github.sha }}"
          for attempt in $(seq 1 20); do
            body="$(curl -fsS --max-time 10 "$url" || true)"
            commit="$(echo "$body" | jq -r '.commit // empty')"
            if [ "$commit" = "$expected" ]; then
              echo "$body"
              echo "matched on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt: serving '${commit:-<no response>}', want '$expected'"
            sleep 6
          done
          echo "::error::/health never reported '$expected' after 20 attempts (~2 min)"
          exit 1

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${{ vars.EXPO_PUBLIC_SITE_URL }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Preview deployed: ${url}\nCommit: \`${context.sha.slice(0, 7)}\``,
            });
